<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% if page.title %}{{ page.title }} | {% endif %}{{ site.title }} — {{
      site.tagline }}
    </title>
    <meta
      property="og:title"
      content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}"
    />
    <meta
      property="og:description"
      content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncatewords: 30 }}{% else %}{{ site.description }}{% endif %}"
    />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:image" content="{{ site.url }}/logo.png" />
    <meta
      property="og:type"
      content="{% if page.layout == 'post' %}article{% else %}website{% endif %}"
    />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}"
    />
    <meta
      name="twitter:description"
      content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncatewords: 30 }}{% else %}{{ site.description }}{% endif %}"
    />
    <meta name="twitter:image" content="{{ site.url }}/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    {% if page.url == "/" %}<link rel="preload" as="image" href="/logo.png" />{% endif %}
    <link rel="stylesheet" href="/style.css" />
    <noscript>
      <style>
        @media (max-width: 600px) {
          .nav-inner {
            height: auto;
            flex-wrap: wrap;
          }
          .nav-toggle {
            display: none;
          }
          .nav-links {
            display: flex;
            position: static;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
            background: none;
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
            border-bottom: none;
            padding: 0.5rem 0 1rem;
          }
        }
      </style>
    </noscript>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <nav>
      <div class="nav-inner">
        <a class="nav-logo" href="/">
          <img src="/logomark.png" alt="Corundum Engine" />
          Corundum Engine
        </a>
        <button
          class="nav-toggle"
          aria-label="Toggle navigation"
          aria-expanded="false"
          aria-controls="nav-menu"
        >
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
        <ul class="nav-links" id="nav-menu">
          <li><a href="/#about">About</a></li>
          <li><a href="/blog/">Blog</a></li>
          <li>
            <a
              class="nav-icon"
              href="https://github.com/corundumengine"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHub"
            >
              <svg
                viewBox="0 0 16 16"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"
                />
              </svg>
            </a>
          </li>
          <li>
            <a
              class="nav-icon"
              href="https://x.com/CorundumEngine"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="X"
            >
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
                />
              </svg>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <main id="main-content">{{ content }}</main>

    <footer>
      <div class="footer-inner">
        <p class="footer-copy">
          &copy; 2026 Gentle Lion Studios, Inc. &middot;
          <a
            class="footer-link"
            href="https://github.com/corundumengine"
            target="_blank"
            rel="noopener noreferrer"
          >
            GitHub
          </a>
        </p>
      </div>
    </footer>
    <script>
      (function () {
        var toggle = document.querySelector(".nav-toggle");
        var menu = document.getElementById("nav-menu");
        var links = menu.querySelectorAll("a");
        toggle.addEventListener("click", function () {
          var expanded = this.getAttribute("aria-expanded") === "true";
          this.setAttribute("aria-expanded", !expanded);
          menu.classList.toggle("open");
        });
        links.forEach(function (link) {
          link.addEventListener("click", function () {
            menu.classList.remove("open");
            toggle.setAttribute("aria-expanded", "false");
          });
        });
      })();
    </script>
  </body>
</html>
